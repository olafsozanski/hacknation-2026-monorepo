services:
  db:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: udip
      POSTGRES_USER: udip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udip -d udip"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Database: Host=db;Database=udip;Username=udip;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Security__RequireHttps: ${REQUIRE_HTTPS:-false}
      Security__TrustForwardedHeaders: ${TRUST_FORWARDED_HEADERS:-false}
      Security__KnownProxies__0: ${KNOWN_PROXY:-127.0.0.1}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Seed__DemoData: ${DEMO_DATA:-false}
      Seed__DemoPassword: ${DEMO_PASSWORD:-}
      Organization__Name: ${ORGANIZATION_NAME:-Urząd Miasta Bydgoszczy}
      Organization__UnitName: ${ORGANIZATION_UNIT:-Biuro Komunikacji Społecznej}
      Organization__CaseNumberPrefix: ${CASE_NUMBER_PREFIX:-BKS.IV.1431}
      Ai__Provider: ${AI_PROVIDER:-OpenAI}
      Ai__Endpoint: ${AI_ENDPOINT:-}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__ChatModel: ${AI_CHAT_MODEL:-gpt-5-mini}
      Ai__EmbeddingModel: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      Ai__IsLocal: ${AI_IS_LOCAL:-false}
      Ai__AllowExternalProcessing: ${AI_ALLOW_EXTERNAL_PROCESSING:-false}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ollama-models:/root/.ollama

volumes:
  db-data:
  ollama-models:
